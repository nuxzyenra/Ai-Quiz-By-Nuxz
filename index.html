<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Quiziz By Nuxz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>AI Quiziz By Nuxz</h1>
      <p class="subtitle">Buat quiz belajar dengan bantuan AI sesuai materi yang kamu inginkan.</p>
    </header>

    <main>
      <!-- Form Container -->
      <section id="form-container" class="container active">
        <form id="quiz-form" class="card">
          <div class="form-group">
            <label for="topic">Materi / Topik <span class="required">*</span></label>
            <textarea id="topic" rows="3" placeholder="Contoh: Dasar-dasar sistem rem kendaraan" required></textarea>
          </div>
          <div class="form-group">
            <label for="instruction">Instruksi Tambahan</label>
            <textarea id="instruction" rows="3" placeholder="Contoh: Fokus pada fungsi komponen dan ciri-ciri kerusakannya."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="count">Jumlah Soal</label>
              <input type="number" id="count" min="1" value="10" required>
            </div>
            <div class="form-group">
              <label for="difficulty">Tingkat Kesulitan</label>
              <select id="difficulty">
                <option value="Mudah">Mudah</option>
                <option value="Sedang" selected>Sedang</option>
                <option value="Sulit">Sulit</option>
                <option value="Sangat Sulit">Sangat Sulit</option>
              </select>
            </div>
          </div>
          <button type="submit" id="start-btn" class="btn btn-primary btn-block">Mulai Quiz</button>
        </form>
      </section>

      <!-- Loading Container -->
      <section id="loading-container" class="container">
        <div class="loading-card card">
          <div class="spinner"></div>
          <h2 id="loading-title">Mempersiapkan quiz...</h2>
          <p id="loading-status">AI sedang menyusun soal...</p>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>
      </section>

      <!-- Quiz Container -->
      <section id="quiz-container" class="container">
        <div class="quiz-header">
          <span id="question-progress" class="badge">Soal 1 dari 10</span>
          <span id="question-type" class="badge badge-secondary">Pilihan Ganda</span>
          <span id="question-difficulty" class="badge badge-info">Sedang</span>
        </div>
        <div class="progress-bar">
          <div id="quiz-progress-fill" class="progress-fill"></div>
        </div>
        <div id="question-card" class="card question-card">
          <!-- Pertanyaan akan dirender di sini -->
        </div>
        <div id="answer-feedback" class="feedback-area"></div>
        <button id="next-btn" class="btn btn-primary btn-block" style="display:none;">Soal Berikutnya</button>
      </section>

      <!-- Result Container -->
      <section id="result-container" class="container">
        <div class="result-card card">
          <h2>Hasil Quiz</h2>
          <div id="final-score" class="score-display">0</div>
          <div id="result-summary" class="result-summary"></div>
          <button id="review-btn" class="btn btn-secondary btn-block">Lihat Review</button>
          <button id="new-quiz-btn" class="btn btn-primary btn-block">Quiz Baru</button>
        </div>
      </section>

      <!-- Review Container -->
      <section id="review-container" class="container">
        <h2>Review Jawaban</h2>
        <div id="review-list" class="review-list"></div>
        <button id="back-to-result-btn" class="btn btn-secondary btn-block">Kembali ke Hasil</button>
        <button id="new-quiz-btn-2" class="btn btn-primary btn-block">Quiz Baru</button>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
